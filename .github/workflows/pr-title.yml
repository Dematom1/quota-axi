name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(feat|fix|chore|ci|docs|refactor|test|perf|build|revert)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "PR title must use conventional commit format"
            exit 1
          fi
